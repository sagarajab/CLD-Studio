version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd cld-studio
        - npm install
    build:
      commands:
        - npm run build
        - cp public/amplify_outputs.json dist/ || echo 'amplify_outputs.json not found, using fallback config'
  artifacts:
    baseDirectory: cld-studio/dist
    files:
      - '**/*'
  cache:
    paths:
      - cld-studio/node_modules/**/* 